# Local stack: Postgres + pgvector, backend, MCP server (streamable HTTP), web workspace.
# Offline by default (stub model, local OCR). Open http://localhost:3000.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dealroom
      POSTGRES_PASSWORD: local-only-not-a-secret
      POSTGRES_DB: dealroom
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealroom"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://dealroom:local-only-not-a-secret@postgres:5432/dealroom
      DEALROOM_LLM: ${DEALROOM_LLM:-stub}
      DEALROOM_CORS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy

  mcp:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["dealroom-mcp", "--http"]
    environment:
      DEALROOM_USER: mcp-agent
      DEALROOM_ROLE: analyst
    ports: ["8001:8000"]

  web:
    build:
      context: web
    environment:
      DEALROOM_API_URL: http://backend:8000
    ports: ["3000:3000"]
    depends_on: [backend]
