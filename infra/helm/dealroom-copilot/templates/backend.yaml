{{- $name := include "dealroom.name" . -}}
# Ingestion runs once per install or upgrade, before the backend serves traffic.
# In cloud mode the PDFs are redacted before they are sent to Document Intelligence.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-ingest-{{ .Release.Revision }}
  labels:
    {{- include "dealroom.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "dealroom.selector" (dict "root" . "component" "ingest") | nindent 8 }}
        {{- if eq .Values.mode "cloud" }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: dealroom-backend
      restartPolicy: OnFailure
      containers:
        - name: ingest
          image: {{ include "dealroom.image" (dict "root" . "name" .Values.image.backend) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["dealroom", "ingest"]
          env:
            {{- include "dealroom.env" . | nindent 12 }}
          volumeMounts:
            {{- include "dealroom.mounts" . | nindent 12 }}
          securityContext:
            {{- include "dealroom.securityContext" . | nindent 12 }}
      volumes:
        {{- include "dealroom.volumes" . | nindent 8 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-backend
  labels:
    {{- include "dealroom.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "dealroom.selector" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dealroom.selector" (dict "root" . "component" "backend") | nindent 8 }}
        {{- if eq .Values.mode "cloud" }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: dealroom-backend
      containers:
        - name: backend
          image: {{ include "dealroom.image" (dict "root" . "name" .Values.image.backend) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- include "dealroom.env" . | nindent 12 }}
          volumeMounts:
            {{- include "dealroom.mounts" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "dealroom.securityContext" . | nindent 12 }}
      volumes:
        {{- include "dealroom.volumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-backend
  labels:
    {{- include "dealroom.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "dealroom.selector" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- if .Values.mcp.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-mcp
  labels:
    {{- include "dealroom.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mcp.replicas }}
  selector:
    matchLabels:
      {{- include "dealroom.selector" (dict "root" . "component" "mcp") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dealroom.selector" (dict "root" . "component" "mcp") | nindent 8 }}
        {{- if eq .Values.mode "cloud" }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: dealroom-backend
      containers:
        - name: mcp
          image: {{ include "dealroom.image" (dict "root" . "name" .Values.image.backend) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["dealroom-mcp", "--http"]
          ports:
            - name: mcp
              containerPort: 8000
          env:
            {{- include "dealroom.env" . | nindent 12 }}
            - name: DEALROOM_USER
              value: {{ .Values.mcp.user | quote }}
            - name: DEALROOM_ROLE
              value: {{ .Values.mcp.role | quote }}
          volumeMounts:
            {{- include "dealroom.mounts" . | nindent 12 }}
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
          securityContext:
            {{- include "dealroom.securityContext" . | nindent 12 }}
      volumes:
        {{- include "dealroom.volumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-mcp
  labels:
    {{- include "dealroom.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "dealroom.selector" (dict "root" . "component" "mcp") | nindent 4 }}
  ports:
    - name: mcp
      port: 8000
      targetPort: mcp
{{- end }}
