apiVersion: v1
kind: ServiceAccount
metadata:
  name: dealroom-backend
  labels:
    {{- include "dealroom.labels" . | nindent 4 }}
  {{- if eq .Values.mode "cloud" }}
  annotations:
    azure.workload.identity/client-id: {{ required "azure.workloadIdentityClientId is required in cloud mode" .Values.azure.workloadIdentityClientId | quote }}
  {{- end }}
automountServiceAccountToken: {{ eq .Values.mode "cloud" }}
{{- if eq .Values.mode "cloud" }}
---
# Mounts the AI client certificate (private key + X.509, one PEM) and syncs the
# database URL into a Kubernetes secret. The managed identity may read these two
# objects and nothing else in the vault.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "dealroom.name" . }}-keyvault
  labels:
    {{- include "dealroom.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.azure.workloadIdentityClientId | quote }}
    keyvaultName: {{ required "azure.keyVaultName is required in cloud mode" .Values.azure.keyVaultName | quote }}
    tenantId: {{ .Values.azure.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.azure.certificateName }}
          objectType: secret
          objectAlias: ai-client.pem
        - |
          objectName: database-url
          objectType: secret
          objectAlias: database-url
  secretObjects:
    - secretName: {{ include "dealroom.name" . }}-database
      type: Opaque
      data:
        - objectName: database-url
          key: url
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dealroom.name" . }}-index
  labels:
    {{- include "dealroom.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: {{ .Values.index.storageClass }}
  resources:
    requests:
      storage: {{ .Values.index.size }}
