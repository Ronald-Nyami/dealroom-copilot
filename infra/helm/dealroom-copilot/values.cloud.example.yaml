  workloadIdentityClientId: 00000000-0000-0000-0000-000000000000
  keyVaultName: kv-dealroom-xxxxx
  certificateName: dealroom-ai-client
  openaiEndpoint: https://oai-dealroom-xxxxx.openai.azure.com/
  openaiDeployment: gpt-4o-mini
  documentIntelligenceEndpoint: https://di-dealroom-xxxxx.cognitiveservices.azure.com/
