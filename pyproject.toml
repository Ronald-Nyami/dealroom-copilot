[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dealroom-copilot"
version = "0.1.0"
description = "Agentic due-diligence assistant over a synthetic private-equity data room"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ronald Nyami" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "langgraph>=0.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "pdfplumber>=0.11",
  "pymupdf>=1.24",
  "openpyxl>=3.1",
  "pytesseract>=0.3.10",
  "pillow>=10",
  "reportlab>=4.2",
  "mcp>=2.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
onnx = ["fastembed>=0.4"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-openpyxl"]

[project.scripts]
dealroom = "dealroom.cli:main"
dealroom-mcp = "dealroom_mcp.server:main"

[tool.setuptools.packages.find]
where = ["backend", "mcp_server"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["dealroom", "dealroom_mcp"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["backend", "mcp_server"]
packages = ["dealroom", "dealroom_mcp"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*", "pytesseract", "pdfplumber", "pdfplumber.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["postgres: needs a Postgres database with pgvector (DATABASE_URL)"]

[tool.coverage.run]
source = ["dealroom", "dealroom_mcp"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
